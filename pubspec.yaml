name: uni_market
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  provider: ^6.1.1
  google_fonts: ^6.2.1
  cloud_firestore: ^6.4.1
  http: ^1.2.1
  image_picker: ^1.2.2
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  intl: ^0.20.2
  webview_flutter: ^4.13.1
  file_picker: ^11.0.2
  record: ^6.2.1
  audioplayers: ^6.6.0
  video_player: ^2.11.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/banners/
